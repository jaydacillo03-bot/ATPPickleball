<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="obs_scoreboard.css">
  <title>OBS Scoreboard Overlay</title>
</head>
<body>
  <div id="scoreboard">
    <div class="team left">
      <div class="team-name" id="teamA">Team A</div>
      <div class="team-score" id="scoreA">0</div>
    </div>

    <div class="middle">
      <div class="match">VS</div>
    </div>

    <div class="team right">
      <div class="team-name" id="teamB">Team B</div>
      <div class="team-score" id="scoreB">0</div>
    </div>
  </div>

  <script src="obs_scoreboard.js"></script>
</body>
</html>
